{% set name = "nlpaug" %}
{% set version = "2.0.7" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  path: .

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - pip
    - python >=3.12
  run:
    - python >=3.12
    - pip
    - numpy >=2.4.6,<2.5
    - pandas >=3.0.3,<4
    - requests >=2.32,<3
    - gdown >=5.2,<6

about:
  home: "https://github.com/makcedward/nlpaug"
  license: MIT
  summary: "Natural language processing augmentation library for deep neural networks."
  dev_url: "https://nlpaug.readthedocs.io/"
